name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the survey page inside the app
        run: |
          set -e
          test -f index.html || { echo "index.html is missing from the repo root"; exit 1; }
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          ls -la android/app/src/main/assets

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}

      - name: Name the file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk \
             "out/road-furniture-mrd-1.${{ github.run_number }}.apk"

      - name: Attach it to this run
        uses: actions/upload-artifact@v4
        with:
          name: road-furniture-mrd-apk
          path: out/*.apk
          if-no-files-found: error
